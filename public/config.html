<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設定簽名框</title>
    <link rel="stylesheet" href="/assets/shared.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="title">設定簽名框</div>
          <div id="docPill" class="pill mono"></div>
        </div>
        <div class="row">
          <a class="btn" href="/" >回到上傳</a>
          <a id="dashLink" class="btn" href="#">狀態看板</a>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>PDF 預覽與拉框</h2>
          <div class="row" style="justify-content:space-between">
            <div class="row">
              <button id="prevPage" class="btn" type="button">上一頁</button>
              <button id="nextPage" class="btn" type="button">下一頁</button>
              <div class="pill"><b>頁</b> <span id="pageInfo" class="mono"></span></div>
            </div>
            <div class="row">
              <select id="fieldType">
                <option value="signature">手寫簽名</option>
                <option value="text">文字（寫字）</option>
              </select>
              <input id="fieldLabel" class="input" style="width:220px" placeholder="欄位名稱（可選）" />
              <label class="pill" style="cursor:pointer">
                <input id="fieldRequired" type="checkbox" checked />
                <span>必填</span>
              </label>
            </div>
          </div>
          <div class="hr"></div>
          <div class="pdfStage">
            <canvas id="pdfCanvas" class="pdfCanvas"></canvas>
            <div id="overlay" class="overlay"></div>
          </div>
          <div class="hr"></div>
          <div class="row">
            <button id="saveFields" class="btn primary" type="button">儲存所有簽名框</button>
            <span id="saveHint" class="muted small"></span>
          </div>
          <div class="muted small" style="margin-top:8px">
            - 在 PDF 上拖曳拉框即可新增欄位（可多個）。<br />
            - 若你之後重新儲存欄位，既有簽名資料會被清掉（因為欄位 ID 會更新）。<br />
          </div>
        </div>

        <div class="card">
          <h2>欄位清單（本文件）</h2>
          <div id="fieldList" class="col"></div>
          <div class="hr"></div>
          <h2>簽名者連結</h2>
          <div class="linkline">
            <div class="url mono" id="signerUrl"></div>
            <div class="row">
              <a id="openSigner" class="btn" target="_blank" rel="noopener">開啟</a>
              <button id="copySigner" class="btn" type="button">複製</button>
            </div>
          </div>
          <div class="muted small" style="margin-top:8px">
            把這個連結傳給簽名者（手機開啟）。他們點選框後即可手寫簽名。
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/config.js"></script>
  </body>
</html>
